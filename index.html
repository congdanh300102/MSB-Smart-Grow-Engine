<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSB Smart Growth Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px; color: #1d2733;
            background: #fafafa; z-index: 9; }
    #boot .t { font-weight: 700; font-size: 1.1rem; }
    #boot .s { color: #5B6770; font-size: .9rem; max-width: 460px; text-align: center; }
    #boot .bar { width: 220px; height: 4px; background: #eee; border-radius: 4px; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: #E4002B;
                    animation: mv 1.1s infinite ease-in-out; }
    @keyframes mv { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    #boot .retry { display: none; margin-top: 6px; padding: 6px 16px; border: none;
                    border-radius: 6px; background: #E4002B; color: #fff; font-size: .85rem;
                    cursor: pointer; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="t">MSB Smart Growth Engine</div>
    <div class="bar" id="boot-bar"><i></i></div>
    <div class="s" id="boot-msg">Đang tải Python + dữ liệu (~55MB, chỉ lần đầu, sau đó cache trong trình duyệt).
      Full 25.000 khách hàng — chạy hoàn toàn trên máy bạn, không cần server.</div>
    <button class="retry" id="boot-retry" onclick="location.reload()">Tải lại trang</button>
  </div>
  <div id="root"></div>
  <script>
    // CDN đôi lúc trả lỗi tạm thời khi tải các chunk JS lazy-load của stlite
    // ("Failed to fetch dynamically imported module") -> tự tải lại trang 1 lần.
    // Dùng sessionStorage để không lặp vô hạn nếu lỗi lặp lại thật sự.
    function isChunkError(msg) {
      return typeof msg === "string" && (msg.includes("dynamically imported module")
        || msg.includes("Failed to fetch") || msg.includes("Importing a module script failed"));
    }
    function handleFatal(msg) {
      if (!isChunkError(msg)) return;
      const tries = Number(sessionStorage.getItem("msb_reload_tries") || "0");
      if (tries < 2) {
        sessionStorage.setItem("msb_reload_tries", String(tries + 1));
        const m = document.getElementById("boot-msg");
        if (m) m.textContent = "Mạng/CDN gián đoạn, đang tự tải lại (" + (tries + 1) + "/2)…";
        setTimeout(() => location.reload(), 1200);
      } else {
        document.getElementById("boot-bar").style.display = "none";
        document.getElementById("boot-msg").textContent =
          "Không tải được do mạng/CDN chập chờn. Bấm 'Tải lại trang', hoặc thử mạng khác.";
        document.getElementById("boot-retry").style.display = "inline-block";
      }
    }
    window.addEventListener("error", (e) => handleFatal(e?.message || String(e?.error || "")));
    window.addEventListener("unhandledrejection", (e) => handleFatal(String(e?.reason?.message || e?.reason || "")));
  </script>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    mount(
      {
        requirements: ["plotly"],
        entrypoint: "streamlit_app/app.py",
        files: {
        "streamlit_app/app.py": {
                "url": "./streamlit_app/app.py"
        },
        "data/parquet/customer_360_feature_mart.csv.gz": {
                "url": "./data/parquet/customer_360_feature_mart.csv.gz"
        },
        "data/parquet/ai_customer_score.csv.gz": {
                "url": "./data/parquet/ai_customer_score.csv.gz"
        },
        "data/parquet/dim_customer.csv.gz": {
                "url": "./data/parquet/dim_customer.csv.gz"
        },
        "data/parquet/dim_product.csv.gz": {
                "url": "./data/parquet/dim_product.csv.gz"
        },
        "data/parquet/rm_action_feedback.csv.gz": {
                "url": "./data/parquet/rm_action_feedback.csv.gz"
        },
        "data/parquet/ai_model_coefficient.csv.gz": {
                "url": "./data/parquet/ai_model_coefficient.csv.gz"
        },
        "data/parquet/ai_model_metric.csv.gz": {
                "url": "./data/parquet/ai_model_metric.csv.gz"
        },
        "data/parquet/ai_model_registry.csv.gz": {
                "url": "./data/parquet/ai_model_registry.csv.gz"
        },
        "data/parquet/dim_product_catalogue.csv.gz": {
                "url": "./data/parquet/dim_product_catalogue.csv.gz"
        },
        "data/parquet/agg_product_demand.csv.gz": {
                "url": "./data/parquet/agg_product_demand.csv.gz"
        },
        "data/parquet/agg_segment_product_affinity.csv.gz": {
                "url": "./data/parquet/agg_segment_product_affinity.csv.gz"
        },
        "data/parquet/fact_customer_product_holding.csv.gz": {
                "url": "./data/parquet/fact_customer_product_holding.csv.gz"
        },
        "data/parquet/agg_product_propensity.csv.gz": {
                "url": "./data/parquet/agg_product_propensity.csv.gz"
        },
        "data/parquet/ai_agent_review.csv.gz": {
                "url": "./data/parquet/ai_agent_review.csv.gz"
        },
        "data/parquet/ai_model_adjustment.csv.gz": {
                "url": "./data/parquet/ai_model_adjustment.csv.gz"
        },
        "data/parquet/ai_product_recommendation_v2.csv.gz": {
                "url": "./data/parquet/ai_product_recommendation_v2.csv.gz"
        },
        "data/parquet/rm_feedback_ai.csv.gz": {
                "url": "./data/parquet/rm_feedback_ai.csv.gz"
        },
        "data/parquet/ai_score_reason.csv.gz": {
                "url": "./data/parquet/ai_score_reason.csv.gz"
        },
        "data/parquet/ai_recommendation.csv.gz": {
                "url": "./data/parquet/ai_recommendation.csv.gz"
        },
        "data/parquet/fact_campaign.csv.gz": {
                "url": "./data/parquet/fact_campaign.csv.gz"
        },
        "data/parquet/ml_propensity_training_set.csv.gz": {
                "url": "./data/parquet/ml_propensity_training_set.csv.gz"
        },
        "models/model_report.md": {
                "url": "./models/model_report.md"
        },
        "models/ai_agent_report.md": {
                "url": "./models/ai_agent_report.md"
        },
        "models/rule_overrides.json": {
                "url": "./models/rule_overrides.json"
        }
},
      },
      document.getElementById("root"),
    );
    const iv = setInterval(() => {
      if (document.querySelector("#root .stApp, #root [data-testid='stAppViewContainer'], #root iframe")) {
        document.getElementById("boot")?.remove();
        clearInterval(iv);
        sessionStorage.removeItem("msb_reload_tries");   // tải thành công -> reset bộ đếm
      }
    }, 400);
    setTimeout(() => { document.getElementById("boot")?.remove(); clearInterval(iv); }, 120000);
  </script>
</body>
</html>
