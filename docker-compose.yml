services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msb_sge_app
    restart: unless-stopped
    environment:
      APP_MAX_CUST: "25000"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
    ports:
      - "8501:8501"

  db:
    image: postgres:16-alpine
    container_name: msb_sge_db
    environment:
      POSTGRES_USER: msb
      POSTGRES_PASSWORD: msb
      POSTGRES_DB: msb_sge
    ports:
      - "5433:5432"
    volumes:
      - ./data:/data:ro
      - ./sql:/sql:ro
      - msb_pgdata:/var/lib/postgresql/data

volumes:
  msb_pgdata:
